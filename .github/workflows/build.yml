name: ESP32 Firmware CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
  # Используем стабильный ubuntu-22.04, чтобы избежать проблем с новыми версиями раннеров
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-install-action@v8
        with:
          esp_idf_version: v5.3.1
          target: esp32

      - name: Build Firmware
        shell: bash
        run: |
          idf.py set-target esp32
          idf.py build
          