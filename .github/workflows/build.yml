name: ESP32 Firmware CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ESP-IDF
        uses: open-home-automation/action-esp-idf@v3
        with:
          version: "5.3.1"
          target: "esp32"

      - name: Build Firmware
        shell: bash
        run: |
          idf.py set-target esp32
          idf.py build
          