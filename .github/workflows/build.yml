name: ESP32 Firmware CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build
          